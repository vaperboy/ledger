name: Ledger
options:
  bundleIdPrefix: com.matasdovyda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LedgerEngine:
    path: ../Engine
targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - path: Ledger
        excludes:
          - "Resources/art/cells/**"
          - "Resources/Content/**"
      - path: Ledger/Resources/art/cells
        type: folder
        buildPhase: resources
      - path: Ledger/Resources/Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: LedgerEngine
        product: LedgerEngine
    entitlements:
      path: Entitlements/Ledger.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    info:
      path: InfoPlists/Ledger.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.matasdovyda.ledger.invite
            CFBundleURLSchemes: [ledger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matasdovyda.ledger
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ledger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  LedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LedgerUITests
    dependencies:
      - target: Ledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matasdovyda.ledger.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ledger
  LedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LedgerTests
    dependencies:
      - target: Ledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matasdovyda.ledger.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ledger.app/Ledger"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Ledger:
    build:
      targets:
        Ledger: all
    run:
      config: Debug
      storeKitConfiguration: Ledger.storekit
    test:
      config: Debug
      targets:
        - LedgerTests
        - LedgerUITests
