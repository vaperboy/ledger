# XcodeGen project definition. On a Mac:  brew install xcodegen && cd native/App && xcodegen generate && open Ledger.xcodeproj
# The game engine is the Swift package in ../Engine; the app only contains screens.
name: Ledger
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LedgerEngine:
    path: ../Engine
targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - Ledger
    dependencies:
      - package: LedgerEngine
        product: LedgerEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ledger          # change to your own before App Store submission
        TARGETED_DEVICE_FAMILY: "1,2"                          # iPhone and iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ledger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
schemes:
  Ledger:
    build:
      targets:
        Ledger: all
    run:
      config: Debug
