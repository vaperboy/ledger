name: Native iOS (SwiftUI) build and test

# Separate from the web/Capacitor workflows. Runs only when the native project changes.
on:
  workflow_dispatch:
  push:
    branches: [ native-swiftui ]
    paths: [ 'native/**', '!native/docs/**', '!native/design/**' ]
  pull_request:
    paths: [ 'native/**', '!native/docs/**', '!native/design/**', '.github/workflows/native-ios.yml' ]

permissions:
  contents: write

jobs:
  engine-tests:
    # A newer push replaces an unfinished older run of this job, so the Mac queue never builds old commits.
    concurrency:
      group: native-engine-tests-${{ github.ref }}
      cancel-in-progress: true
    # Same runner and Xcode as app-build, so the engine is tested with the toolchain that builds the app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Test the game engine
        working-directory: native/Engine
        env:
          LEDGER_PROGRESS: "1"
        run: |
          set -o pipefail
          # Release build with testing enabled: the same tests, several times faster (the long balance probes ran past what the
          # macOS runner allows a silent test process in a debug build).
          if ! swift test -c release -Xswiftc -enable-testing > test.log 2>&1; then
            grep -E "error: -\[" test.log | sed -E "s#.*Tests/LedgerTests/##" | head -n 80
          grep -nE "Fatal error|fatalError|Exited with|signal|crash" test.log | tail -n 10
            grep -n "PROGRESS" test.log | tail -n 8
            tail -n 40 test.log
            # A crashed test process leaves no XCTest output: print the macOS crash report's faulting thread.
            R=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -n 1)
            if [ -n "$R" ]; then echo "== crash report $R"; python3 -c "
          import json,sys
          t=open(sys.argv[1]).read().split('\\n',1)[1]; d=json.loads(t)
          print('exception:', d.get('exception'), d.get('termination',{}).get('indicator'))
          imgs=d.get('usedImages',[])
          for th in d.get('threads',[]):
              if th.get('triggered'):
                  for f in th.get('frames',[])[:40]:
                      im=imgs[f.get('imageIndex',0)].get('name','?') if imgs else '?'
                      print(' ', im, f.get('symbol','?'), f.get('sourceFile',''), f.get('sourceLine',''))
          " "$R" || head -c 4000 "$R"; fi
            exit 1
          fi
          tail -n 5 test.log

      - name: Backtrace of the crashing test (only if the tests failed)
        if: failure()
        working-directory: native/Engine
        run: |
          B=$(find .build -name "LedgerEnginePackageTests.xctest" -maxdepth 4 | head -n 1)
          X=$(xcrun -f xctest)
          echo "bundle=$B xctest=$X"
          LEDGER_PROGRESS=1 lldb --batch -o "process handle SIGILL SIGTRAP SIGSEGV SIGBUS SIGABRT -s true -n true" -o run -o "bt 60" -o "thread list" \
            -- "$X" -XCTest LedgerTests.BalanceGuardTests/testCapitalHeavyTradesEarnModestReturns "$B" 2>&1 | grep -vE "^PROGRESS" | tail -n 90

  # Runs in parallel with engine-tests (both must pass): a compile error in the app shows up without waiting for the long engine tests.
  app-build:
    concurrency:
      group: native-app-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/App
        run: xcodegen generate
      - name: Build for the iOS simulator (iPhone and iPad)
        working-directory: native/App
        run: |
          # Only the compiler's own messages are printed: the full log is mostly very long command lines.
          if ! xcodebuild build -project Ledger.xcodeproj -scheme Ledger \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -80
            grep -E "\.swift:[0-9]+|PLEASE|Stack dump|Segmentation|crash|Assertion|SIG" build.log | sort -u | head -40
            tail -n 25 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep "/native/App/" | sort -u | head -30 || true
          tail -n 3 build.log

  # When the app compiles on a push to native-swiftui, publish it straight to AltStore: unsigned IPA as a GitHub Release
  # and a new entry in apps.json (AltStore source). Engine tests run beside it and are evidence, not a gate.
  # Version = latest version in apps.json + 1, so it always rises. Notes come from RELEASE_NOTES.md.
  launch-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/App
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: native/App
        run: |
          xcodebuild build -project Ledger.xcodeproj -scheme Ledger -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath $RUNNER_TEMP/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep -E "error:" build.log | head -40; exit 1; }
      - name: Launch on a simulator and print the crash
        run: |
          APP=$(find $RUNNER_TEMP/dd/Build/Products -name "Ledger.app" -maxdepth 3 | head -n 1)
          DEV=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch --terminate-running-process "$DEV" "$BID" || echo "LAUNCH CALL FAILED"
          sleep 20
          if xcrun simctl spawn "$DEV" launchctl list | grep -i "$BID"; then echo "RUNNING"; else echo "NOT RUNNING"; touch notrunning; fi
          xcrun simctl spawn "$DEV" log show --last 3m --style compact --predicate 'process == "Ledger" OR eventMessage CONTAINS "Fatal error" OR eventMessage CONTAINS "com.example.ledger"' 2>&1 | tail -80 || true
          find ~/Library/Logs/DiagnosticReports -name "*.ips" -newer notrunning 2>/dev/null | head -3 || true
          for f in $(find ~/Library/Logs/DiagnosticReports -name "Ledger*.ips" 2>/dev/null | head -2); do echo "== $f"; head -c 6000 "$f"; done || true
          test ! -f notrunning

  # Manual only: screenshots of every popup site on a small and a large phone, as an artifact (shots/<device>/). Independent of
  # app-build and release.
  popup-shots:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: popup-shots-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/App
        run: xcodegen generate
      - name: Run PopupShotsTests on each device
        working-directory: native/App
        run: |
          xcrun simctl list devices available | grep -E "iPhone" || true
          mkdir -p "$GITHUB_WORKSPACE/shots"
          for WANT in "iPhone SE (3rd generation)" "iPhone 16 Pro Max"; do
            DEV="$WANT"
            if ! xcrun simctl list devices available | grep -qF "    $WANT ("; then
              # nearest available: SE-like (smallest) or Pro Max-like (largest)
              case "$WANT" in
                *SE*) DEV=$(xcrun simctl list devices available | grep -oE "iPhone SE[^(]*\([0-9a-z ]*\)" | head -n 1 | sed -E 's/ +$//') ;;
                *) DEV=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -V | tail -n 1) ;;
              esac
              [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -oE "iPhone [0-9A-Za-z ]+" | head -n 1 | sed -E 's/ +$//')
              echo "$WANT not available, using $DEV"
            fi
            SAFE=$(echo "$DEV" | tr -c 'A-Za-z0-9' '_')
            echo "== $DEV"
            xcodebuild test -project Ledger.xcodeproj -scheme Ledger \
              -only-testing:LedgerUITests/PopupShotsTests \
              -destination "platform=iOS Simulator,name=$DEV" \
              -resultBundlePath "$RUNNER_TEMP/$SAFE.xcresult" \
              CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/$SAFE.log" 2>&1 || { echo "tests failed on $DEV"; grep -E "error:" "$RUNNER_TEMP/$SAFE.log" | sort -u | head -20; }
            mkdir -p "$GITHUB_WORKSPACE/shots/$SAFE"
            # Xcode 16: `xcresulttool export attachments` writes the files and a manifest.json; fall back to the old JSON export.
            if ! xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$SAFE.xcresult" --output-path "$GITHUB_WORKSPACE/shots/$SAFE"; then
              echo "export attachments failed; trying legacy get"
              xcrun xcresulttool get --legacy --path "$RUNNER_TEMP/$SAFE.xcresult" --format json > "$GITHUB_WORKSPACE/shots/$SAFE/result.json" || true
            fi
          done
          find "$GITHUB_WORKSPACE/shots" -type f | head -n 5
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-shots
          path: shots/
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/native-swiftui'
    runs-on: macos-15
    needs: app-build
    concurrency:
      group: ipa-release
      cancel-in-progress: false
    env:
      BUNDLE_ID: com.example.ledger
      SOURCE_BRANCH: native-swiftui
    steps:
      - uses: actions/checkout@v4
      - name: Next version number
        id: ver
        run: |
          git fetch origin "$SOURCE_BRANCH"
          N=$(git show "origin/$SOURCE_BRANCH:apps.json" | python3 -c "import json,sys,re; d=json.load(sys.stdin); v=[int(x['version'].split('.')[-1]) for a in d.get('apps',[]) for x in a.get('versions',[])]; print(max(v+[0])+1)")
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Publishing 1.0.$N"
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
      - name: Generate the Xcode project
        working-directory: native/App
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned for devices
        working-directory: native/App
        run: |
          set -o pipefail
          xcodebuild build -project Ledger.xcodeproj -scheme Ledger -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath $RUNNER_TEMP/dd \
            MARKETING_VERSION=1.0.${{ steps.ver.outputs.n }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.n }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
      - name: Package the IPA
        run: |
          APP=$(find $RUNNER_TEMP/dd/Build/Products -name "Ledger.app" -maxdepth 3 | head -n 1)
          test -n "$APP"
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -R "$APP" $RUNNER_TEMP/ipa/Payload/
          (cd $RUNNER_TEMP/ipa && zip -qry Ledger-unsigned.ipa Payload)
      - name: Check the app's version and bundle id match the AltStore entry
        run: |
          P="$RUNNER_TEMP/ipa/Payload/Ledger.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$P")" = "1.0.${{ steps.ver.outputs.n }}"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$P")" = "${{ steps.ver.outputs.n }}"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$P")" = "$BUNDLE_ID"
      - name: Publish a GitHub Release with the IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.n }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/ipa/Ledger-unsigned.ipa" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Ledger build $TAG" --notes-file RELEASE_NOTES.md --latest
      - name: Check out the AltStore source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
      - name: Update apps.json with the new IPA
        env:
          TAG: v${{ steps.ver.outputs.n }}
          RUN: ${{ steps.ver.outputs.n }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          IPA: ${{ runner.temp }}/ipa/Ledger-unsigned.ipa
        run: |
          python3 - <<'PY'
          import json, os, datetime
          p = "source/apps.json"
          repo, tag, run = os.environ["REPO"], os.environ["TAG"], os.environ["RUN"]
          size = os.path.getsize(os.environ["IPA"])
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          raw = "https://raw.githubusercontent.com/%s/%s" % (repo, os.environ.get("SOURCE_BRANCH", "native-swiftui"))
          icon = raw + "/native/App/Ledger/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          url = "https://github.com/%s/releases/download/%s/Ledger-unsigned.ipa" % (repo, tag)
          try:
              src = json.load(open(p))
          except Exception:
              src = {}
          src.setdefault("name", "Ledger")
          src.setdefault("identifier", "com.example.ledger.source")
          src.setdefault("subtitle", "Ledger business simulation builds")
          src.setdefault("description", "Unsigned builds of the Ledger business simulation. AltStore signs them with your own Apple ID.")
          src["iconURL"] = icon
          src.setdefault("tintColor", "#CFB185")
          src.setdefault("website", "https://github.com/%s" % repo)
          src.setdefault("news", [])
          apps = src.setdefault("apps", [])
          app = next((a for a in apps if a.get("bundleIdentifier") == os.environ["BUNDLE_ID"]), None)
          if app is None:
              app = {"name": "Ledger", "bundleIdentifier": os.environ["BUNDLE_ID"], "developerName": "Ledger",
                     "subtitle": "Run real businesses", "localizedDescription": "Ledger: a business-management simulation.",
                     "tintColor": "#CFB185", "screenshotURLs": [], "versions": []}
              apps.append(app)
          app["iconURL"] = icon
          version = "1.0.%s" % run
          try:
              notes = open("RELEASE_NOTES.md").read().strip()
          except Exception:
              notes = ""
          if not notes:
              notes = "Build %s from %s" % (tag, os.environ["SHA"][:7])
          entry = {"version": version, "buildVersion": run, "date": now, "downloadURL": url, "size": size,
                   "minOSVersion": "17.0", "localizedDescription": notes[:1200]}
          versions = [v for v in app.get("versions", []) if v.get("version") != version]
          app["versions"] = ([entry] + versions)[:20]
          # fields older AltStore versions read
          app.update({"version": version, "versionDate": now, "downloadURL": url, "size": size})
          json.dump(src, open(p, "w"), indent=2)
          open(p, "a").write("\n")
          PY
      - name: Commit and push apps.json
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "AltStore source: build v${{ steps.ver.outputs.n }}" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin "$SOURCE_BRANCH" && git push origin "HEAD:$SOURCE_BRANCH" && break; sleep 5; done
