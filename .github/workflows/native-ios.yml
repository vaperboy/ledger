name: Native iOS (SwiftUI) build and test

# Separate from the web/Capacitor workflows. Runs only when the native project changes.
on:
  workflow_dispatch:
  push:
    branches: [ native-swiftui ]
    paths: [ 'native/**', '.github/workflows/native-ios.yml' ]
  pull_request:
    paths: [ 'native/**', '.github/workflows/native-ios.yml' ]

permissions:
  contents: write

jobs:
  engine-tests:
    # Same runner and Xcode as app-build, so the engine is tested with the toolchain that builds the app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Test the game engine
        working-directory: native/Engine
        run: |
          set -o pipefail
          if ! swift test > test.log 2>&1; then
            grep -nE "error:|Fatal error|fatalError|Exited with|signal|crash|Test Case .* started" test.log | tail -n 60
            tail -n 40 test.log
            exit 1
          fi
          tail -n 5 test.log

  app-build:
    runs-on: macos-15
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/App
        run: xcodegen generate
      - name: Build for the iOS simulator (iPhone and iPad)
        working-directory: native/App
        run: |
          # Only the compiler's own messages are printed: the full log is mostly very long command lines.
          if ! xcodebuild build -project Ledger.xcodeproj -scheme Ledger \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -80
            exit 1
          fi
          grep -E "warning:" build.log | grep "/native/App/" | sort -u | head -30 || true
          tail -n 3 build.log

  screenshots:
    runs-on: ${{ matrix.runner }}
    needs: app-build
    # The iOS 26 run shows the real Liquid Glass; it depends on the runner image having Xcode 26, so it may not block.
    continue-on-error: ${{ matrix.device == 'iphone-ios26' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: iphone, runner: macos-15, xcode: '16', sim: 'iPhone 16 Pro ' }
          - { device: ipad, runner: macos-15, xcode: '16', sim: 'iPad Pro 13' }
          - { device: iphone-ios26, runner: macos-26, xcode: '26', sim: 'iPhone 17 Pro ' }
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/App
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -30
          PAT='${{ matrix.sim }}'
          NAME=$(xcrun simctl list devices available | grep -E "^ +$PAT" | head -1 | sed -E 's/^ +//; s/ \([0-9A-F-]+\).*//')
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | sed -E 's/^ +//; s/ \([0-9A-F-]+\).*//'); fi
          echo "Using: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Run the UI tour and keep screenshots
        working-directory: native/App
        run: |
          set -o pipefail
          xcodebuild test -project Ledger.xcodeproj -scheme Ledger \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath ../../shots.xcresult CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Export the pictures
        if: always()
        run: |
          mkdir -p shots out
          xcrun xcresulttool export attachments --path shots.xcresult --output-path shots || true
          python3 - <<'PY'
          import json, os, re, shutil
          d = "shots"
          try:
              m = json.load(open(os.path.join(d, "manifest.json")))
              for t in m:
                  for a in t.get("attachments", []):
                      name = a.get("suggestedHumanReadableName", "").split("_0_")[0]
                      src = os.path.join(d, a["exportedFileName"])
                      if re.match(r"^\d\d-[a-z0-9-]+$", name) and os.path.exists(src):
                          shutil.copy(src, os.path.join("out", name + ".png"))
          except Exception as e:
              print("manifest:", e)
          PY
          for f in out/*.png; do [ -f "$f" ] && sips -s format jpeg -s formatOptions 70 -Z 1100 "$f" --out "${f%.png}.jpg" >/dev/null && rm "$f"; done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.device }}
          path: out
      - name: Publish the pictures to a branch (so they can be looked at without downloading)
        if: always() && github.event_name == 'push'
        run: |
          cd out
          git init -q
          git checkout -q -b ui-shots-${{ matrix.device }}
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -qm "UI screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD
