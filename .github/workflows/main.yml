      - name: Wrap Web Game & Compile Xcode Archive
        run: |
          # Extract all folders from game.zip on GitHub's server
          unzip -q game.zip
          rm game.zip
          
          # If your zip extracted into a single subfolder, move contents to root
          shopt -s dotglob
          for dir in */; do
            if [ "$dir" != ".git/" ] && [ "$dir" != ".github/" ]; then
              mv "$dir"* . 2>/dev/null || true
              rmdir "$dir" 2>/dev/null || true
            fi
          done
