name: Native iOS feature tours

on:
  push:
    branches: [ ui-tours, 'ui-tours-*' ]
  workflow_dispatch:
    inputs:
      only:
        description: One test method name (empty = all tours)
        default: ''

permissions:
  contents: read

jobs:
  ui-tours:
    concurrency:
      group: ui-tours-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            tests: testT01_TabsAndHome testT02_PhoneAppsA testT06_Ventures
          - shard: b
            tests: testT03_PhoneAppsB testT04_Group testT07_Ownership
          - shard: c
            tests: testT10_CompanySections testT11_TeamHiring testT14_CompanyPopups
          - shard: d
            tests: testT12_ManageAndSuppliers testT13_SalesItemAndMarketing testT20_DayAndReports testT21_Inbox
          - shard: e
            tests: testT05_SwipeBack testT22_ShopsAndInsurance testT23_Bank
          - shard: f
            tests: testT24_OtherPopups testT26_NewCompany
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: native/App
        run: xcodegen generate
      - name: Run the feature tours on iPhone 16 Pro
        timeout-minutes: 88
        working-directory: native/App
        env:
          ONLY: ${{ inputs.only }}
          TESTS: ${{ matrix.tests }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -z "$ONLY" ] && [ -f LedgerUITests/tour-only.txt ]; then ONLY=$(tr '\n' ' ' < LedgerUITests/tour-only.txt | sed -E 's/ +$//'); fi
          if [ -n "$ONLY" ] && [ "$SHARD" != "a" ]; then echo "only $ONLY: shard $SHARD has nothing to run"; exit 0; fi
          xcrun simctl list devices available | grep -E "iPhone" || true
          DEV="iPhone 16 Pro"
          if ! xcrun simctl list devices available | grep -qF "    $DEV ("; then
            DEV=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro" | sort -V | tail -n 1)
            [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -oE "iPhone [0-9A-Za-z ]+" | head -n 1 | sed -E 's/ +$//')
            echo "iPhone 16 Pro not available, using $DEV"
          fi
          echo "== $DEV"
          mkdir -p "$RUNNER_TEMP/tour"
          if [ -n "$ONLY" ]; then TESTS="$ONLY"; fi
          ONLYARGS=""
          for t in $TESTS; do case "$t" in */*) ONLYARGS="$ONLYARGS -only-testing:LedgerUITests/$t";; *) ONLYARGS="$ONLYARGS -only-testing:LedgerUITests/FeatureToursTests/$t";; esac; done
          echo "== shard $SHARD: $TESTS"
          TEST_RUNNER_TOUR_OUT="$RUNNER_TEMP/tour/result.txt" xcodebuild test -project Ledger.xcodeproj -scheme Ledger \
            $ONLYARGS \
            -destination "platform=iOS Simulator,name=$DEV" \
            -resultBundlePath "$RUNNER_TEMP/tours.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/tours.log" 2>&1 || { echo "xcodebuild test exited non-zero (expected when a tour step raised an XCTest issue)"; grep -E "error:" "$RUNNER_TEMP/tours.log" | sort -u | head -20; }
          OUT="$RUNNER_TEMP/tour/result.txt"
          if ! grep -q "=== END TOUR RESULT ===" "$OUT" 2>/dev/null; then
            grep -q "=== END TOUR RESULT ===" "$RUNNER_TEMP/tours.log" && sed -n '/=== TOUR RESULT ===/,/=== END TOUR RESULT ===/p' "$RUNNER_TEMP/tours.log" > "$RUNNER_TEMP/tour/from-log.txt" && OUT="$RUNNER_TEMP/tour/from-log.txt"
          fi
          if ! grep -q "=== END TOUR RESULT ===" "$OUT" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/tour/att"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tours.xcresult" --output-path "$RUNNER_TEMP/tour/att" || true
            F=$(grep -l "=== END TOUR RESULT ===" "$RUNNER_TEMP"/tour/att/* 2>/dev/null | head -n 1)
            [ -n "$F" ] && OUT="$F"
          fi
          echo "TOUR_OUT=$OUT" >> "$GITHUB_ENV"
          if grep -q "=== END TOUR RESULT ===" "$OUT" 2>/dev/null; then
            sed -n '/=== TOUR RESULT ===/,/=== END TOUR RESULT ===/p' "$OUT"
          else
            echo "NO TOUR RESULT BLOCK (the summary test did not run). Steps recorded so far:"
            grep -E "^\[(PASS|FAIL|SKIP|NOTE)\]" "$RUNNER_TEMP/tour/result.txt" 2>/dev/null | grep -E "^\[(FAIL|NOTE)\]" | head -n 80 || true
            echo "steps recorded: $(grep -cE '^\[(PASS|FAIL|SKIP)\]' "$RUNNER_TEMP/tour/result.txt" 2>/dev/null || echo 0)"
          fi
          N=$( { grep -hcE '^\[(PASS|FAIL|SKIP)\]' "$RUNNER_TEMP/tour/result.txt" 2>/dev/null; grep -hE '^steps: [0-9]+' "$OUT" 2>/dev/null | sed -E 's/steps: ([0-9]+).*/\1/'; } | sort -n | tail -n 1)
          echo "steps counted: ${N:-0}"
          if [ -z "$N" ] || [ "$N" = "0" ]; then
            echo "THE TOURS COULD NOT RUN"
            grep -E "error:|Testing failed|BUILD FAILED|\*\* TEST FAILED" "$RUNNER_TEMP/tours.log" | sort -u | head -40
            tail -n 30 "$RUNNER_TEMP/tours.log"
            exit 1
          fi
      - name: Print the result file (also after a timeout)
        if: always()
        run: |
          F="$RUNNER_TEMP/tour/result.txt"
          echo "steps recorded: $(grep -cE '^\[(PASS|FAIL|SKIP)\]' "$F" 2>/dev/null)"
          if grep -q "=== END TOUR RESULT ===" "$F" 2>/dev/null; then sed -n '/=== TOUR RESULT ===/,/=== END TOUR RESULT ===/p' "$F"; else grep -E "^\[(FAIL|SKIP|NOTE)\]" "$F" 2>/dev/null | cut -c1-300 | head -300; fi
      - name: Export the step screenshots
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/tours.xcresult" ] || { echo "no result bundle"; exit 0; }
          mkdir -p "$RUNNER_TEMP/att" "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tours.xcresult" --output-path "$RUNNER_TEMP/att" || { echo "export failed"; exit 0; }

          python3 - "$RUNNER_TEMP/att" "$RUNNER_TEMP/shots" <<'PY'
          import json, os, re, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          n = 0
          for t in json.load(open(os.path.join(src, "manifest.json"))):
              for a in t.get("attachments", []):
                  f = a.get("exportedFileName", "")
                  if not f.lower().endswith((".png", ".jpg", ".jpeg", ".heic")):
                      continue
                  n += 1
                  name = re.sub(r"[^A-Za-z0-9._-]+", "_", a.get("suggestedHumanReadableName", f))[:120]
                  shutil.copy(os.path.join(src, f), os.path.join(dst, "%03d-%s" % (n, name if "." in name[-5:] else name + ".png")))
          print("screenshots:", n)
          PY
          for f in "$RUNNER_TEMP"/shots/*; do sips -Z 900 "$f" >/dev/null 2>&1 || true; done
          ls "$RUNNER_TEMP/shots" | head -5
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-shots-${{ matrix.shard }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-result-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/tour/result.txt
            ${{ runner.temp }}/tours.log
          if-no-files-found: warn

  summary:
    needs: ui-tours
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Merge the screenshots into one artifact (tour-shots)
        uses: actions/upload-artifact/merge@v4
        continue-on-error: true
        with:
          name: tour-shots
          pattern: tour-shots-*
          separate-directories: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tour-result-*
          path: results
      - name: Print the combined result block
        run: |
          F=$(ls results/*/tour/result.txt results/*/result.txt 2>/dev/null | sort -u)
          cat $F 2>/dev/null | grep -E '^\[(PASS|FAIL|SKIP|NOTE)\]' > all.txt || true
          P=$(grep -c '^\[PASS\]' all.txt || true); X=$(grep -c '^\[FAIL\]' all.txt || true); S=$(grep -c '^\[SKIP\]' all.txt || true)
          echo "=== TOUR RESULT ==="
          echo "steps: $((P + X + S))  pass: $P  fail: $X  skip: $S"
          grep '^\[FAIL\]' all.txt | sed -E 's/^\[FAIL\] /FAIL /' | cut -c1-400
          grep '^\[SKIP\]' all.txt | sed -E 's/^\[SKIP\] /SKIP /' | cut -c1-160
          grep '^\[NOTE\]' all.txt | sed -E 's/^\[NOTE\] /NOTE /' | sort -u | head -60 | cut -c1-300
          echo "=== END TOUR RESULT ==="
