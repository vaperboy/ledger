name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Any Zip and Locate Game Files
        run: |
          mkdir -p extracted_game www
          
          # 1. Unzip any .zip file in the repository into a clean folder
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -q -o "$z" -d extracted_game
            fi
          done
          
          # 2. Find where index.html is inside the extracted zip (even if nested in subfolders)
          INDEX_FILE=$(find extracted_game -name "index.html" | head -n 1)
          
          if [ -n "$INDEX_FILE" ]; then
            GAME_DIR=$(dirname "$INDEX_FILE")
            cp -R "$GAME_DIR"/. www/
          else
            # Fallback if there is no index.html at a nested level
            cp -R extracted_game/. www/
            echo "<!DOCTYPE html><html><body><h1>Game Loaded</h1></body></html>" > www/index.html
          fi

      - name: Wrap Game & Compile Xcode Archive
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "MyGame" "com.mygame.app" --web-dir www
          npx cap add ios
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r $GITHUB_WORKSPACE/Game.ipa Payload

      - name: Upload Compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ready-Game-IPA
          path: Game.ipa
